spring.application.name=incident-investigator
server.port=8080

# File-based H2 database so incident history survives restarts.
spring.datasource.url=jdbc:h2:file:./data/incidents;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# An incident is opened automatically once an error group reaches this many occurrences.
incident.auto-open-threshold=3
# A group counts as "recurring" once it has been seen in at least this many distinct hours.
incident.recurring-min-hours=2
# Load the bundled sample logs on startup when the database is empty.
incident.sample-data.enabled=true
